<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Tareas por fecha de creación</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">TaskFlow</a>
      <nav class="nav-links">
        <a href="../index.html#inicio" class="js-guest-only">Inicio</a>
        <a href="../index.html#caracteristicas" class="js-guest-only">Características</a>
        <a href="../index.html#tareas" class="js-guest-only">Tareas</a>
        <a href="user-registration.html" class="js-guest-only">Registro</a>
        <a href="user-login.html" class="js-guest-only">Inicio de sesión</a>
        <a href="create-task.html" class="js-auth-only" style="display:none;">Crear tarea</a>
        <a href="list-tasks.html" class="js-auth-only" style="display:none;">Lista</a>
        <a href="delete-task.html" class="js-auth-only" style="display:none;">Eliminar</a>
      </nav>
      <a href="../index.html" class="button button-secondary js-logout-button" style="display:none;">Cerrar sesión</a>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Filtro por fecha de creación</p>
          <h2>Visualiza tareas por fecha de creación</h2>
          <p class="section-copy">Selecciona un rango de fechas para ver todas las tareas creadas en ese período.</p>
        </div>

        <div class="task-panel">
          <div class="auth-card">
            <form id="date-filter-form" class="task-form" novalidate>
              <div class="form-field">
                <label for="start-date">Fecha de inicio</label>
                <input id="start-date" name="startDate" type="date" />
              </div>
              <div class="form-field">
                <label for="end-date">Fecha de fin</label>
                <input id="end-date" name="endDate" type="date" />
              </div>
              <button type="submit" class="button button-primary">Filtrar tareas</button>
            </form>
            <div id="filtered-tasks" class="tasks-container">
              <!-- Tareas filtradas se mostrarán aquí -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/task-created-date.js"></script>
  <script src="../js/auth-nav.js"></script>
</body>
</html>
