<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Categorías de tareas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">TaskFlow</a>
      <nav class="nav-links">
        <a href="../index.html#inicio">Inicio</a>
        <a href="../index.html#caracteristicas">Características</a>
        <a href="../index.html#tareas">Tareas</a>
        <a href="user-registration.html">Registro</a>
        <a href="user-login.html">Inicio de sesión</a>
      </nav>
      <a href="../index.html" class="button button-secondary">Volver</a>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Categorías de tareas</p>
          <h2>Gestiona las categorías de tus tareas</h2>
          <p class="section-copy">Crea y organiza categorías para clasificar tus tareas de manera eficiente.</p>
        </div>

        <div class="task-panel">
          <div class="auth-card">
            <form id="category-form" class="task-form" novalidate>
              <div class="form-field">
                <label for="category-name">Nombre de la categoría</label>
                <input id="category-name" name="name" type="text" placeholder="Ej. Trabajo, Personal, Urgente" required maxlength="50" />
              </div>
              <div class="form-field">
                <label for="category-color">Color</label>
                <input id="category-color" name="color" type="color" value="#007bff" />
              </div>
              <button type="submit" class="button button-primary">Crear categoría</button>
            </form>
            <div id="categories-list" class="categories-list">
              <!-- Lista de categorías se cargará aquí -->
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/task-category.js"></script>
</body>
</html>
