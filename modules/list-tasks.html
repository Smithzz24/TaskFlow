<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Lista de tareas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">TaskFlow</a>
      <nav class="nav-links">
        <a href="../index.html#inicio">Inicio</a>
        <a href="../index.html#caracteristicas">Características</a>
        <a href="../index.html#beneficios">Beneficios</a>
        <a href="user-registration.html">Registro</a>
        <a href="user-login.html">Inicio de sesión</a>
      </nav>
      <a href="../index.html" class="button button-secondary">Volver</a>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Tareas</p>
          <h2>Gestiona tareas con categoría y estado</h2>
          <p class="section-copy">Agrega tareas con título, información adicional y categoría, luego marca si están hechas o en espera.</p>
        </div>

        <div class="task-panel">
          <form id="task-form" class="task-form">
            <div class="form-field">
              <label for="task-title">Título de la tarea</label>
              <input id="task-title" type="text" placeholder="Ej. Leer capítulo" required maxlength="80" />
            </div>
            <div class="form-field">
              <label for="task-desc">Información</label>
              <textarea id="task-desc" placeholder="Describe brevemente la tarea" rows="3" maxlength="180"></textarea>
            </div>
            <div class="form-field">
              <label for="task-category">Categoría</label>
              <select id="task-category">
                <option value="Académica">Académica</option>
                <option value="Personal">Personal</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Salud">Salud</option>
              </select>
            </div>
            <button type="submit" class="button button-primary">Agregar tarea</button>
          </form>

          <div class="task-list-card">
            <div class="task-list-header">
              <h3>Lista de tareas</h3>
              <span id="task-count">0 tareas</span>
            </div>
            <div class="task-list-toolbar">
              <label for="status-filter">Filtrar por estado</label>
              <select id="status-filter">
                <option value="all">Todas</option>
                <option value="pending">Pendientes</option>
                <option value="done">Hechas</option>
              </select>
            </div>
            <ul id="task-list" class="task-list"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
