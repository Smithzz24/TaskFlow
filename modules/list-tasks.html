<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Lista de tareas</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="list-page">
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">TaskFlow</a>
      <nav class="nav-links">
        <a href="../index.html#inicio" class="js-guest-only">Inicio</a>
        <a href="../index.html#caracteristicas" class="js-guest-only">Características</a>
        <a href="../index.html#beneficios" class="js-guest-only">Beneficios</a>
        <a href="create-task.html" class="js-auth-only" style="display:none;">Crear tarea</a>
        <a href="list-tasks.html" class="js-auth-only" style="display:none;">Lista</a>
        <a href="delete-task.html" class="js-auth-only" style="display:none;">Eliminar</a>
      </nav>
      <a href="../index.html" class="button button-secondary js-logout-button" style="display:none;">Cerrar sesión</a>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Tareas</p>
          <h2>Gestiona tareas con categoría y estado</h2>
          <p class="section-copy">Crea tareas en el módulo Crear tarea y luego usa esta lista para ver su información y cambiar el estado a En espera, En desarrollo o Hecho.</p>
          <div class="task-list-card">
            <div class="task-list-header">
              <h3>Lista de tareas</h3>
              <span id="task-count">0 tareas</span>
            </div>
            <div class="task-list-toolbar">
              <label for="status-filter">Filtrar por estado</label>
              <select id="status-filter">
                <option value="all">Todas</option>
                <option value="pending">En espera</option>
                <option value="in-progress">En desarrollo</option>
                <option value="done">Hecho</option>
              </select>
            </div>
            <ul id="task-list" class="task-list"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/auth-nav.js"></script>
</body>
</html>
