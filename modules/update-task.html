<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Actualizar tarea</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">TaskFlow</a>
      <nav class="nav-links">
        <a href="../index.html#inicio">Inicio</a>
        <a href="../index.html#caracteristicas">Características</a>
        <a href="../index.html#tareas">Tareas</a>
        <a href="user-registration.html">Registro</a>
        <a href="user-login.html">Inicio de sesión</a>
      </nav>
      <a href="../index.html" class="button button-secondary">Volver</a>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Actualizar tarea</p>
          <h2>Modifica los detalles de tu tarea</h2>
          <p class="section-copy">Actualiza el título, descripción, fecha límite o prioridad de tu tarea.</p>
        </div>

        <div class="task-panel">
          <div class="auth-card">
            <form id="update-task-form" class="task-form" novalidate>
              <div class="form-field">
                <label for="task-title">Título de la tarea</label>
                <input id="task-title" name="title" type="text" placeholder="Ej. Preparar presentación" required maxlength="80" />
              </div>
              <div class="form-field">
                <label for="task-desc">Descripción</label>
                <textarea id="task-desc" name="description" placeholder="Describe brevemente la tarea" rows="5" maxlength="240"></textarea>
              </div>
              <div class="task-meta-grid">
                <div class="form-field">
                  <label for="task-date">Fecha límite</label>
                  <input id="task-date" name="dueDate" type="date" />
                </div>
                <div class="form-field">
                  <label for="task-priority">Prioridad</label>
                  <select id="task-priority" name="priority">
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                    <option value="baja">Baja</option>
                  </select>
                </div>
              </div>
              <p id="update-task-message" class="form-message" aria-live="polite"></p>
              <div class="form-actions">
                <button type="submit" class="button button-primary">Actualizar tarea</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/update-task.js"></script>
</body>
</html></content>
