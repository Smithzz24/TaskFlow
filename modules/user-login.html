<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Iniciar sesión</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">TaskFlow</a>
      <nav class="nav-links">
        <a href="../index.html#inicio">Inicio</a>
        <a href="../index.html#caracteristicas">Características</a>
        <a href="../index.html#beneficios">Beneficios</a>
        <a href="user-registration.html">Registro</a>
      </nav>
      <a href="../index.html" class="button button-secondary">Volver</a>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Inicio de sesión</p>
          <h2>Ingresa a tu cuenta TaskFlow</h2>
          <p class="section-copy">Accede para ver tus tareas y continuar tu flujo de trabajo sin interrupciones.</p>
        </div>

        <div class="task-panel">
          <div class="auth-card">
            <form id="login-form" class="task-form" novalidate>
              <div class="form-field">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" placeholder="ejemplo@correo.com" required />
              </div>
              <div class="form-field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="Tu contraseña" required minlength="8" />
              </div>
              <p id="login-message" class="form-message" aria-live="polite"></p>
              <div class="form-actions">
                <button type="submit" class="button button-primary">Iniciar sesión</button>
                <a href="user-registration.html" class="button button-secondary">Crear cuenta</a>
              </div>
              <div class="auth-switch">
                <p>¿Aún no tienes cuenta?</p>
                <a href="user-registration.html">Regístrate aquí</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
