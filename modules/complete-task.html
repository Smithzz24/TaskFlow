<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Completar tarea</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="brand">TaskFlow</a>
      <nav class="nav-links">
        <a href="../index.html#inicio" class="js-guest-only">Inicio</a>
        <a href="../index.html#caracteristicas" class="js-guest-only">Características</a>
        <a href="../index.html#tareas" class="js-guest-only">Tareas</a>
        <a href="user-registration.html" class="js-guest-only">Registro</a>
        <a href="user-login.html" class="js-guest-only">Inicio de sesión</a>
        <a href="create-task.html" class="js-auth-only" style="display:none;">Crear tarea</a>
        <a href="list-tasks.html" class="js-auth-only" style="display:none;">Lista</a>
        <a href="delete-task.html" class="js-auth-only" style="display:none;">Eliminar</a>
      </nav>
      <a href="../index.html" class="button button-secondary js-logout-button" style="display:none;">Cerrar sesión</a>
    </div>
  </header>

  <main>
    <section class="section reveal">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow">Completar tarea</p>
          <h2>Marcar una tarea como completada</h2>
          <p class="section-copy">Selecciona la tarea que has terminado y confirma su completación.</p>
        </div>

        <div class="task-panel">
          <div class="auth-card">
            <form id="complete-task-form" class="task-form" novalidate>
              <div class="form-field">
                <label for="task-select">Seleccionar tarea</label>
                <select id="task-select" name="taskId" required>
                  <option value="">Selecciona una tarea...</option>
                  <!-- Opciones de tareas se cargarán dinámicamente -->
                </select>
              </div>
              <button type="submit" class="button button-primary">Marcar como completada</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/complete-task.js"></script>
  <script src="../js/auth-nav.js"></script>
</body>
</html>
